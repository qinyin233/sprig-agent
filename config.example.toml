#:schema ./config.schema.json
# Copy sections into your private ~/.sprig/config.toml; never commit real keys.
schema_version = 1
provider = "agnes"
interface = "tui"
# profile = "review"

[providers.agnes]
wire_api = "chat_completions" # chat_completions / messages / responses; see docs/provider-protocols.md
preserve_reasoning = false # opt in only for reasoning_content protocol continuity; private saves then retain it
check_history_format = "tool_calls" # observations for APIs rejecting client-inserted check calls
model = "fast"
base_url = "https://apihub.agnes-ai.com/v1"
api_key_env = "AGNES_API_KEY"
request_timeout = 60 # network idle/connection phase limit; separate from command timeout
request_deadline = 300 # total HTTP I/O limit; 0 < seconds <= 3600
retry_attempts = 0 # opt in to 1..5 extra transient HTTP attempts, sharing this deadline; see docs/provider-retry.md
proxy = "system" # system / direct / http://localhost:7890 (no proxy credentials)
api_key_header = "auto" # Authorization for Chat/Responses; x-api-key for Messages
api_key_scheme = "auto" # bearer for Chat/Responses; raw for Messages; explicit overrides allowed

[providers.agnes.models.fast]
id = "agnes-3.0-flash"
max_context_bytes = 131072 # serialized request bytes, not a model token limit

[providers.agnes.models.fast.generation]
max_tokens = 2048
thinking = false # omit Sprig's thinking preset; this does not disable server-default reasoning
# temperature = 0.2
# top_p = 0.9
# seed = 42
# reasoning_effort = "low" # only if your model supports it
# token_limit_field = "max_completion_tokens" # only if required by your service

[providers.USTC]
model = "fast"
base_url = "https://api.llm.ustc.edu.cn/v1"
api_key_env = "USTC_API_KEY" # name your process environment variable here

[providers.USTC.models.fast]
id = "deepseek-flash"

[providers.USTC.models.fast.generation]
max_tokens = 2048

[providers.USTC.models.qwen]
id = "qwen3.8-chat" # availability depends on your account; use --list-models

# Optional custom headers, values never shown in logs/config reports:
# [providers.USTC.headers]
# X-API-Version = "2026-01"
# [providers.USTC.headers_env]
# X-Organization = "PROVIDER_ORG_TOKEN"

[generation]
token_limit_field = "max_tokens"
# [generation.extra_body]
# verbosity = "low" # provider-specific JSON, no reserved request fields

[agent]
max_steps = 20
recover_output_limit = false # one recovery request inside max_steps after an explicit output-token limit
recover_context_budget = false # ask before summarizing after a local or provider context limit
timeout = 60 # command timeout; HTTP uses provider.request_timeout if set
max_output = 16000
stream = true
request_usage = false # enable only if the service supports SSE usage chunks
read_only = false
inherit_env = false
max_context_bytes = 131072
compact_context = false
project_instructions = true
checks = [] # arrays of argv; each command still asks for fresh approval
check_before_task = false # opt in only with nonempty checks; final checks still run
check_after_edit = false # fixed checks once after each successful file-edit batch
check_files = [] # optional paths to verify with the final fixed checks, e.g. ["src/app.py", "tests/test_app.py"]

[skills]
dirs = [] # explicit skill collections, e.g. ["~/.agents/skills"]; user/profile only

# [mcp.servers.docs]
# transport = "streamable_http"
# url = "https://example.com/mcp"
# protocol_version = "2026-07-28" # older services: 2025-11-25 or 2025-06-18
# headers_env = { Authorization = "MCP_AUTHORIZATION" } # full header, e.g. Bearer ...
# timeout = 30
# deadline = 120

[instructions]
files = [] # e.g. ["CONTRIBUTING.md", "docs/coding-style.md"]; required if listed
response_language = "简体中文" # explanations only; direct user requests take precedence

[tools]
list_files = true
glob = true # filename-only discovery; also disabled when list_files=false
read_file = true
search = true
grep = true # canonical model search; search is the legacy alias; either false disables both
project_map = true
edit_file = true
edit_lines = true # also disabled when edit_file=false
file_action = true # mkdir/delete/move; also disabled when edit_file=false
run = true
update_plan = true # bounded task checklist, not approval or acceptance
question = true # exposed only with an interactive callback; human answers never approve actions
skill = true # exposed only with explicit skills.dirs; loading never executes scripts
mcp = true # explicit endpoints; connect and every RPC ask approval; blocked in read-only
web_fetch = true # requires separate web.enabled opt-in; every GET needs approval
job = true # requires execution.background and run; observe/wait or freshly approve stop
lsp = true # optional configured semantic servers; every query requires approval
read_history = true # only exposed with an active summary; original conversation data, not current file evidence
read_log = true # only exposed with command_log_dir; opaque current-conversation history, never file read_id
explore = true # also requires execution.explore and a fresh approval

[web]
enabled = false # user/profile opt-in, or --web; project cannot enable it
# Only public HTTP(S) text documents; no auth headers/cookies/proxy/redirects/JS.
# <=2 MiB response, <=8 MiB memory cache; local result pages never refetch.

[files]
exclude = ["private/", "*.local.json"] # additive with .sprigignore

[execution]
command_sandbox = "off" # Linux opt-in: "bubblewrap" requires /usr/bin/bwrap with --bind-fd
# sandbox_read_dirs = ["~/.local/share/uv/python/cpython-3.13-linux-x86_64-gnu"]
background = false # opt-in noninteractive owned commands; never restart on restore
background_timeout = 300 # independent background cap, >0..3600 seconds
explore = false # opt-in foreground read-only investigation with the selected model
# Raw command-output kill limit (default 1 MiB; 256..8388608 bytes).
# 0 restores stopping at max_output, including legacy sessions. Larger limits keep head/tail display.
output_limit = 1048576
env_allowlist = [] # additional named variables; model credentials always removed
# env = { BUILD_MODE = "debug" } # trusted literal values, no substitutions/commands

[context]
# Same-layer keys here override legacy [agent] context settings.
files = [] # initial live references, e.g. ["src/main.py"]; workspace-relative POSIX paths
max_bytes = 131072 # actual serialized request bytes, never a token estimate
compact = false # explicitly opt in; full saved history is preserved
trigger_ratio = 0.8 # begin elision at 80% of max_bytes; 0 keeps old always-on behavior
keep_recent_messages = 6 # 6..1000; failures, refusals and user requirements also survive
keep_read_bytes = 8192 # 0..262144; historical complete reads, only within max_bytes; 0 disables

[storage]
# command_log_dir = "~/.sprig/command-logs" # opt-in dedicated private directory outside every repository; see docs/command-logs.md
auto_save_session = false # opt in to private, unencrypted transcripts
# Retention only runs on /prune or --prune-sessions; never auto-delete on startup.
# session_max_age_days = 30
# session_max_count = 64
# session_dir = "~/.local/state/sprig-agent/sessions"
# change_history_dir = "~/.local/state/sprig-agent/changes" # exact file backups

[editor]
# Trusted user/profile argv. Empty disables; never read from a project or EDITOR.
# On Windows use a native .exe, e.g. the actual Code.exe with --wait.
command = [] # e.g. ["nvim", "{file}"] or ["/usr/bin/code", "--wait", "{file}"]
timeout = 300 # <=3600 seconds; each invocation still needs fresh approval

[tui]
theme = "nord"
sidebar = true
editor_height = 5
steering_mode = "all" # or one-at-a-time, at safe agent-loop boundaries
metrics = false

[tui.keybindings]
help = ["f1"]
toggle_sidebar = ["ctrl+b"]
focus_input = ["f3"]
# cancel = ["f6"]
# quit = ["ctrl+f10"]
# new_conversation = ["ctrl+shift+n"] # still asks before clearing a conversation

[profiles.review]
provider = "agnes"
model = "fast"
interface = "tui"

[profiles.review.agent]
read_only = true
checks = []
check_before_task = false
check_after_edit = false

[profiles.review.tools]
edit_file = false
run = false

[profiles.coding]
provider = "USTC"
model = "fast"
interface = "tui"

[profiles.coding.agent]
max_steps = 30
compact_context = true

# Local MCP: configure an already installed executable; never starts on load.
# Enable only after reviewing its code/permissions. The server is NOT sandboxed.
# On Windows prefer node.exe/python.exe directly; .cmd/.bat needs explicit cmd.exe /c argv.
[mcp.servers.local_example]
transport = "stdio"
enabled = false
command = ["python", "-u", "tools/mcp_server.py"]
cwd = "."
protocol_version = "2025-11-25"
timeout = 30
deadline = 120
env = { NODE_ENV = "production" } # nonsecret fixed values
env_from = { API_TOKEN = "MCP_LOCAL_TOKEN" } # secret references to process environment

# LSP: explicit installed executable only; never starts on load or installs packages.
# Server has full current-user filesystem/network authority; review before enabling.
[lsp.servers.cpp_example]
enabled = false
command = ["clangd", "--log=error", "--background-index=false", "--enable-config=false"]
languages = { ".c" = "c", ".h" = "c", ".cpp" = "cpp", ".hpp" = "cpp" }
cwd = "."
timeout = 15
deadline = 60
# env = { NODE_ENV = "production" }
# env_from = { API_TOKEN = "LSP_LOCAL_TOKEN" }

# Explicit reusable task text, from trusted user/profile settings only.
# /review ARGUMENTS sends the expanded task; Tab only completes the name.
[prompts.review]
description = "Review a change and propose checks"
template = """Review the current code for correctness and missing tests.
Scope: $ARGUMENTS
Read the relevant files first; explain findings and propose changes."""

# Numbered arguments use quotes for spaces; backslashes remain literal.
[prompts.explain]
description = "Explain one named file or concept"
template = "Explain $1, with concrete examples."
